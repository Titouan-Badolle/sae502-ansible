---
- name: Installer Apache
  ansible.builtin.apt:
    name: apache2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Démarrer et activer Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Installer PHP et les extensions nécessaires
  ansible.builtin.include_tasks: php.yml
  when: php_install | bool
